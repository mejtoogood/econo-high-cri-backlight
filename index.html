<!doctype html>
<html lang="en" data-mode="white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Backlight">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-v8-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-v8-192.png">
  <title>Econo Backlight</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #000;
    }
    body { position: fixed; inset: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 85fr) minmax(0, 15fr);
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }
    /* iOS 27 samples fixed elements at the top edge to colour its status bar.
       Use an actual element: body backgrounds and pseudo-elements do not suffice. */
    .status-bar-colour-anchor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: #000;
      z-index: 10;
      pointer-events: none;
    }
    .field {
      min-height: 0;
      width: 100%;
      background-color: #fff;
      background-color: color(display-p3 1 1 1);
    }
    html[data-mode="r"] .field { background-color: #f00; background-color: color(display-p3 1 0 0); }
    html[data-mode="g"] .field { background-color: #0f0; background-color: color(display-p3 0 1 0); }
    html[data-mode="b"] .field { background-color: #00f; background-color: color(display-p3 0 0 1); }
    html[data-mode="c"] .field { background-color: #0ff; background-color: color(display-p3 0 1 1); }
    html[data-mode="y"] .field { background-color: #ff0; background-color: color(display-p3 1 1 0); }
    html[data-mode="m"] .field { background-color: #f0f; background-color: color(display-p3 1 0 1); }
    .controls {
      position: relative;
      min-height: 0;
      background: #000;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: end;
      gap: clamp(3px, 1vw, 12px);
      padding: 6px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    button {
      display: grid;
      place-items: center;
      width: 100%;
      height: clamp(44px, 6.5dvh, 64px);
      min-width: 0;
      padding: 0;
      border: 1px solid #595959;
      border-radius: 9px;
      background: #171717;
      color: var(--button-colour, #fff);
      font: 600 clamp(16px, 2.5vmin, 25px)/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* Status/control for iOS wake-lock permission, positioned in unused toolbar space. */
    #wake-button {
      position: absolute;
      top: 6px;
      right: max(8px, env(safe-area-inset-right));
      width: auto;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      background: #202020;
      border-color: #666;
      color: #ddd;
      font: 600 12px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      z-index: 2;
    }
    #wake-button[data-state="held"] {
      background: #19372c;
      border-color: #49826b;
      color: #d3ffe6;
    }
    #wake-button[data-state="error"] {
      border-color: #ad7964;
      color: #ffcab6;
    }
    #wake-button[data-state="unavailable"] {
      color: #999;
    }
    /* Inactive buttons use a coloured label; the active button fills with that colour. */
    button[data-mode="white"] { --button-colour: #fff; --button-ink: #000; }
    button[data-mode="r"] { --button-colour: #f00; --button-ink: #000; }
    button[data-mode="g"] { --button-colour: #0f0; --button-ink: #000; }
    button[data-mode="b"] { --button-colour: #00f; --button-ink: #fff; }
    button[data-mode="c"] { --button-colour: #0ff; --button-ink: #000; }
    button[data-mode="y"] { --button-colour: #ff0; --button-ink: #000; }
    button[data-mode="m"] { --button-colour: #f0f; --button-ink: #000; }
    @supports (color: color(display-p3 1 0 0)) {
      button[data-mode="white"] { --button-colour: color(display-p3 1 1 1); }
      button[data-mode="r"] { --button-colour: color(display-p3 1 0 0); }
      button[data-mode="g"] { --button-colour: color(display-p3 0 1 0); }
      button[data-mode="b"] { --button-colour: color(display-p3 0 0 1); }
      button[data-mode="c"] { --button-colour: color(display-p3 0 1 1); }
      button[data-mode="y"] { --button-colour: color(display-p3 1 1 0); }
      button[data-mode="m"] { --button-colour: color(display-p3 1 0 1); }
    }
    button[aria-pressed="true"] {
      background: var(--button-colour, #fff);
      color: var(--button-ink, #000);
      border-color: var(--button-colour, #fff);
    }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:active { opacity: .78; }
    @media (max-height: 350px) {
      .controls { padding-top: 2px; padding-bottom: max(2px, env(safe-area-inset-bottom)); }
      button { height: min(44px, 16dvh); }
    }
  </style>
</head>
<body>
  <div class="status-bar-colour-anchor" aria-hidden="true"></div>
  <main class="app">
    <div class="field" aria-label="Illumination field"></div>
    <nav class="controls" aria-label="Illumination colours">
      <button type="button" data-mode="white" aria-label="White" aria-pressed="true">W</button>
      <button type="button" data-mode="r" aria-label="Red" aria-pressed="false">R</button>
      <button type="button" data-mode="g" aria-label="Green" aria-pressed="false">G</button>
      <button type="button" data-mode="b" aria-label="Blue" aria-pressed="false">B</button>
      <button type="button" data-mode="c" aria-label="Cyan" aria-pressed="false">C</button>
      <button type="button" data-mode="y" aria-label="Yellow" aria-pressed="false">Y</button>
      <button type="button" data-mode="m" aria-label="Magenta" aria-pressed="false">M</button>
      <button type="button" id="wake-button" data-state="idle" aria-pressed="false">Keep awake</button>
    </nav>
  </main>
  <script>
    (() => {
      const buttons = [...document.querySelectorAll("button[data-mode]")];
      const valid = new Set(buttons.map(button => button.dataset.mode));
      const apply = mode => {
        if (!valid.has(mode)) return;
        document.documentElement.dataset.mode = mode;
        buttons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        });
        try { localStorage.setItem("backlight-mode", mode); } catch (_) {}
      };
      // Safari may reject background/launch requests that lack a user gesture.
      // Do not request at startup: make the first request synchronously from a tap.
      // Show the actual API state rather than silently swallowing errors.
      const wakeButton = document.getElementById("wake-button");
      const field = document.querySelector(".field");
      let wakeLock = null;
      let wakeLockPending = false;
      let wakeLockWanted = true;
      let wakeError = null;

      const updateWakeUI = () => {
        const supported = typeof navigator.wakeLock?.request === "function";
        const held = Boolean(wakeLock && !wakeLock.released);
        wakeButton.setAttribute("aria-pressed", String(held));
        if (!supported) {
          wakeButton.dataset.state = "unavailable";
          wakeButton.textContent = "Wake unavailable";
          wakeButton.title = "Safari does not expose Screen Wake Lock here";
        } else if (held) {
          wakeButton.dataset.state = "held";
          wakeButton.textContent = "Awake ON";
          wakeButton.title = "Screen wake lock granted by Safari. Tap to release.";
        } else if (wakeLockPending) {
          wakeButton.dataset.state = "pending";
          wakeButton.textContent = "Requesting…";
          wakeButton.title = "Requesting screen wake lock";
        } else if (!wakeLockWanted) {
          wakeButton.dataset.state = "idle";
          wakeButton.textContent = "Awake OFF";
          wakeButton.title = "Tap to request screen wake lock";
        } else if (wakeError) {
          wakeButton.dataset.state = "error";
          wakeButton.textContent = "Wake: " + wakeError.name;
          wakeButton.title = wakeError.message;
        } else {
          wakeButton.dataset.state = "idle";
          wakeButton.textContent = "Keep awake";
          wakeButton.title = "Tap to keep the screen awake";
        }
      };

      const requestWakeLock = async () => {
        if (!wakeLockWanted || document.visibilityState !== "visible" ||
            wakeLockPending || (wakeLock && !wakeLock.released)) return;
        if (typeof navigator.wakeLock?.request !== "function") {
          updateWakeUI();
          return;
        }
        wakeLockPending = true;
        wakeError = null;
        updateWakeUI();
        try {
          // Invoke request() before the click handler returns: iOS may require activation.
          const lock = await navigator.wakeLock.request("screen");
          if (!wakeLockWanted || document.visibilityState !== "visible") {
            await lock.release();
            return;
          }
          wakeLock = lock;
          lock.addEventListener("release", () => {
            if (wakeLock === lock) {
              wakeLock = null;
              updateWakeUI();
            }
          });
        } catch (error) {
          wakeError = {
            name: String(error?.name || "Denied"),
            message: String(error?.message || "Safari refused the wake lock")
          };
        } finally {
          wakeLockPending = false;
          updateWakeUI();
        }
      };

      const useWakeOnGesture = () => {
        if (wakeLockWanted) void requestWakeLock();
      };
      buttons.forEach(button => button.addEventListener("click", () => {
        apply(button.dataset.mode);
        useWakeOnGesture();
      }));
      field.addEventListener("click", useWakeOnGesture);
      wakeButton.addEventListener("click", () => {
        if (wakeLock && !wakeLock.released) {
          wakeLockWanted = false;
          const held = wakeLock;
          wakeLock = null;
          void held.release().catch(() => {});
          updateWakeUI();
        } else if (wakeLockPending) {
          wakeLockWanted = false;
          updateWakeUI();
        } else {
          wakeLockWanted = true;
          void requestWakeLock();
        }
      });
      try { apply(localStorage.getItem("backlight-mode") || "white"); } catch (_) { apply("white"); }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && wakeLockWanted) {
          // Reacquire if iOS allows; if rejected, the button reports the error.
          void requestWakeLock();
        } else {
          updateWakeUI();
        }
      });
      window.addEventListener("pageshow", () => {
        if (wakeLockWanted && navigator.userActivation?.hasBeenActive) {
          void requestWakeLock();
        }
        updateWakeUI();
      });
      updateWakeUI();
      document.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
