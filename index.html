<!doctype html>
<html lang="en" data-mode="white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Backlight">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-prism-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-prism-192.png">
  <title>Econo Backlight</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #000;
    }
    body { position: fixed; inset: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 85fr) minmax(0, 15fr);
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }
    /* iOS 27 samples fixed elements at the top edge to colour its status bar.
       Use an actual element: body backgrounds and pseudo-elements do not suffice. */
    .status-bar-colour-anchor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: #000;
      z-index: 10;
      pointer-events: none;
    }
    .field {
      min-height: 0;
      width: 100%;
      background-color: #fff;
      background-color: color(display-p3 1 1 1);
    }
    html[data-mode="r"] .field { background-color: #f00; background-color: color(display-p3 1 0 0); }
    html[data-mode="g"] .field { background-color: #0f0; background-color: color(display-p3 0 1 0); }
    html[data-mode="b"] .field { background-color: #00f; background-color: color(display-p3 0 0 1); }
    html[data-mode="c"] .field { background-color: #0ff; background-color: color(display-p3 0 1 1); }
    html[data-mode="y"] .field { background-color: #ff0; background-color: color(display-p3 1 1 0); }
    html[data-mode="m"] .field { background-color: #f0f; background-color: color(display-p3 1 0 1); }
    .controls {
      min-height: 0;
      background: #000;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: end;
      gap: clamp(3px, 1vw, 12px);
      padding: 6px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    button {
      display: grid;
      place-items: center;
      width: 100%;
      height: clamp(44px, 6.5dvh, 64px);
      min-width: 0;
      padding: 0;
      border: 1px solid #595959;
      border-radius: 9px;
      background: #171717;
      color: var(--button-colour, #fff);
      font: 600 clamp(16px, 2.5vmin, 25px)/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* Inactive buttons use a coloured label; the active button fills with that colour. */
    button[data-mode="white"] { --button-colour: #fff; --button-ink: #000; }
    button[data-mode="r"] { --button-colour: #f00; --button-ink: #000; }
    button[data-mode="g"] { --button-colour: #0f0; --button-ink: #000; }
    button[data-mode="b"] { --button-colour: #00f; --button-ink: #fff; }
    button[data-mode="c"] { --button-colour: #0ff; --button-ink: #000; }
    button[data-mode="y"] { --button-colour: #ff0; --button-ink: #000; }
    button[data-mode="m"] { --button-colour: #f0f; --button-ink: #000; }
    @supports (color: color(display-p3 1 0 0)) {
      button[data-mode="white"] { --button-colour: color(display-p3 1 1 1); }
      button[data-mode="r"] { --button-colour: color(display-p3 1 0 0); }
      button[data-mode="g"] { --button-colour: color(display-p3 0 1 0); }
      button[data-mode="b"] { --button-colour: color(display-p3 0 0 1); }
      button[data-mode="c"] { --button-colour: color(display-p3 0 1 1); }
      button[data-mode="y"] { --button-colour: color(display-p3 1 1 0); }
      button[data-mode="m"] { --button-colour: color(display-p3 1 0 1); }
    }
    button[aria-pressed="true"] {
      background: var(--button-colour, #fff);
      color: var(--button-ink, #000);
      border-color: var(--button-colour, #fff);
    }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:active { opacity: .78; }
    @media (max-height: 350px) {
      .controls { padding-top: 2px; padding-bottom: max(2px, env(safe-area-inset-bottom)); }
      button { height: min(44px, 16dvh); }
    }
  </style>
</head>
<body>
  <div class="status-bar-colour-anchor" aria-hidden="true"></div>
  <main class="app">
    <div class="field" aria-label="Illumination field"></div>
    <nav class="controls" aria-label="Illumination colours">
      <button type="button" data-mode="white" aria-label="White" aria-pressed="true">W</button>
      <button type="button" data-mode="r" aria-label="Red" aria-pressed="false">R</button>
      <button type="button" data-mode="g" aria-label="Green" aria-pressed="false">G</button>
      <button type="button" data-mode="b" aria-label="Blue" aria-pressed="false">B</button>
      <button type="button" data-mode="c" aria-label="Cyan" aria-pressed="false">C</button>
      <button type="button" data-mode="y" aria-label="Yellow" aria-pressed="false">Y</button>
      <button type="button" data-mode="m" aria-label="Magenta" aria-pressed="false">M</button>
    </nav>
  </main>
  <script>
    (() => {
      const buttons = [...document.querySelectorAll("button[data-mode]")];
      const valid = new Set(buttons.map(button => button.dataset.mode));
      const apply = mode => {
        if (!valid.has(mode)) return;
        document.documentElement.dataset.mode = mode;
        buttons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        });
        try { localStorage.setItem("backlight-mode", mode); } catch (_) {}
      };
      buttons.forEach(button => button.addEventListener("click", () => apply(button.dataset.mode)));
      try { apply(localStorage.getItem("backlight-mode") || "white"); } catch (_) { apply("white"); }
      document.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
